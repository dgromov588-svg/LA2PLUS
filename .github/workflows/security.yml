name: Secret scan (gitleaks)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks and scan git history
        run: |
          ver="8.30.1"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_checksums.txt" -o /tmp/gitleaks_checksums.txt
          grep "gitleaks_${ver}_linux_x64.tar.gz$" /tmp/gitleaks_checksums.txt | sed "s|gitleaks_${ver}_linux_x64.tar.gz|/tmp/gitleaks.tar.gz|" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --verbose --redact .
