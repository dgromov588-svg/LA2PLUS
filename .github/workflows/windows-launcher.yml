name: Windows launcher
on:
  push:
    paths: ['launcher/**', '.github/workflows/windows-launcher.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: launcher/go.sum
      - name: Test updater and signed manifests
        working-directory: launcher
        run: go test -race ./internal/...
      - name: Embed Windows resources
        working-directory: launcher
        run: go run github.com/akavel/rsrc -arch amd64 -manifest assets/application.manifest -ico assets/launcher.ico -o cmd/launcher/resource_windows_amd64.syso
      - name: Build native launcher
        working-directory: launcher
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $env:CGO_ENABLED = "0"
          go build -buildvcs=false -trimpath -ldflags "-H windowsgui -s -w" -o dist/LA2PLUS-Launcher.exe ./cmd/launcher
      - name: Native GUI smoke test
        working-directory: launcher
        run: |
          $proof = Join-Path $env:RUNNER_TEMP 'la2plus-gui-proof.txt'
          $p = Start-Process dist/LA2PLUS-Launcher.exe -ArgumentList "--self-test $proof" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Test-Path $proof)) { throw 'Windows GUI initialization failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: LA2PLUS-Windows-Launcher
          path: launcher/dist/LA2PLUS-Launcher.exe
